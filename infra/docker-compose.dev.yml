services:
  mongodb:
    image: mongo:7
    container_name: xambas-mongodb
    restart: unless-stopped
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
      MONGO_INITDB_DATABASE: xambas_dev
    volumes:
      - ../mongo-data:/data/db
