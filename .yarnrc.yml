# Yarn 4 (Berry) — configuración del workspace.
# nodeLinker por defecto: pnp.

packageExtensions:
  # @testing-library/jest-dom expone un entrypoint /vitest que hace require("vitest")
  # sin declararlo como peer; PnP (estricto) lo rechaza. Se lo declaramos aquí.
  "@testing-library/jest-dom@*":
    peerDependencies:
      vitest: "*"
    peerDependenciesMeta:
      vitest:
        optional: true
